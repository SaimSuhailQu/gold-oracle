name: Live dashboard

# Rebuilds the static dashboard snapshot every 5 minutes (GitHub's practical
# cron floor) and publishes it to GitHub Pages (gh-pages branch).
# A client-side 60s price ticker keeps the page feeling live between rebuilds.
# Manual runs: Actions tab -> Live dashboard.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# A new run cancels the previous one so slow builds never pile up in a queue.
concurrency:
  group: pages-live
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate fresh signal
        # If the fresh run fails (e.g. broken market-data pull), keep the last
        # committed signal so the site stays up; staleness is shown honestly.
        run: python -m gold_oracle.signal || echo "::warning::signal generation failed — deploying last committed signal"

      - name: Build static site
        run: python scripts/build_static_dashboard.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
